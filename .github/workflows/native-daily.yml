name: Native daily stable build

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Publish a new firmware release even when source is unchanged'
        type: boolean
        default: false

concurrency:
  group: native-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Benniphx/techo5' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      base: ${{ steps.prepare.outputs.base }}
      commit: ${{ steps.prepare.outputs.commit }}
      version: ${{ steps.prepare.outputs.version }}
      firmware_artifact: ${{ steps.artifacts.outputs.firmware }}
      history_artifact: ${{ steps.artifacts.outputs.history }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test synchronization and release safety
        run: |
          python3 -m unittest discover -s tools -p 'test_native*.py' -v
      - name: Prepare stable upstream candidate
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build && 'true' || 'false' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$FORCE_BUILD" = true ]; then
            python3 tools/native_daily.py --run-number "$RUN_NUMBER" --force
          else
            python3 tools/native_daily.py --run-number "$RUN_NUMBER"
          fi
      - name: Record build artifact names for failed-job retries
        id: artifacts
        if: steps.prepare.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          echo "firmware=native-show5-$VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "history=native-candidate-history-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.prepare.outputs.changed == 'true'
        with:
          go-version: '1.26'
          cache-dependency-path: echod/go.sum
      - name: Test candidate
        if: steps.prepare.outputs.changed == 'true'
        working-directory: echod
        run: |
          go test ./...
          go test -tags dot ./...
          go test -tags spot ./...
      - name: Prepare ephemeral ARM rootfs build host
        if: steps.prepare.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user-static binfmt-support uidmap
          sudo update-binfmts --enable qemu-arm
          # Ubuntu's AppArmor namespace restriction applies to this disposable
          # GitHub runner only. No developer or device host is changed.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          runner_user=$(id -un)
          if ! awk -F: -v user="$runner_user" '$1 == user {found=1} END {exit !found}' /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$runner_user"
          fi
          test -e /proc/sys/fs/binfmt_misc/qemu-arm
      - name: Build complete experimental Show firmware
        if: steps.prepare.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ steps.prepare.outputs.commit }}
        run: |
          python3 tools/fetch-inputs.py --device show
          mkdir -p "$HOME/apk" bin/release
          cp inputs/apk.static "$HOME/apk/apk.static"
          chmod +x "$HOME/apk/apk.static"
          bash tools/linux/build-aec.sh
          test -s bin/techo5-aec-arm
          bash tools/linux/build-ffmpeg.sh
          test -s bin/techo5-ffmpeg-arm
          # No PREBUILT_DAEMON override: build directly from the tested candidate.
          bash tools/linux/deploy-rootfs.sh --out "bin/release/techo5-rootfs-$VERSION.tar.gz" --version "$VERSION"
          cp bin/echod-arm bin/build-info.json bin/release/
          python3 tools/native_firmware.py stage --directory bin/release --version "$VERSION" --commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.prepare.outputs.changed == 'true'
        with:
          name: ${{ steps.artifacts.outputs.firmware }}
          path: bin/release/
          retention-days: 3
          if-no-files-found: error
      - name: Bundle tested history
        if: steps.prepare.outputs.changed == 'true'
        env:
          BASE: ${{ steps.prepare.outputs.base }}
        run: git bundle create candidate.bundle HEAD "^$BASE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.prepare.outputs.changed == 'true'
        with:
          name: ${{ steps.artifacts.outputs.history }}
          path: candidate.bundle
          retention-days: 1
          if-no-files-found: error
      - name: Build summary
        env:
          CHANGED: ${{ steps.prepare.outputs.changed }}
          VERSION: ${{ steps.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ steps.prepare.outputs.commit }}
        run: |
          # shellcheck disable=SC2129
          if [ "$CHANGED" = true ]; then
            echo "Built $VERSION from $SOURCE_COMMIT; promotion follows in a separate job." >> "$GITHUB_STEP_SUMMARY"
            echo 'Built rootfs and pinned keyless bootstrap images for Show 5 checkers/cronos; signed publication follows after promotion.' >> "$GITHUB_STEP_SUMMARY"
            echo "Staged firmware disk footprint: $(du -sh bin/release | cut -f1)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Latest stable release and native source unchanged: build skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Public repository, standard Linux runner: no private Actions minutes. Staged artifacts expire after 3 days (history: 1 day); published release assets remain available.' >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download tested history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --repo "$REPO" --name "${{ needs.build.outputs.history_artifact }}"
      - name: Promote exactly the tested commit
        env:
          BASE: ${{ needs.build.outputs.base }}
          CANDIDATE: ${{ needs.build.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git bundle verify candidate.bundle
          git fetch candidate.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          git merge-base --is-ancestor "$BASE" "$CANDIDATE"
          # No candidate programs run in the job that can write main.
          # The helper expands the token only when Git invokes it, never in this shell.
          # shellcheck disable=SC2016
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push "https://github.com/$REPO.git" "$CANDIDATE:refs/heads/main"

  publish:
    needs: [build, promote]
    if: needs.build.outputs.changed == 'true' && needs.promote.result == 'success' && github.repository == 'Benniphx/techo5' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: native-release
    permissions:
      contents: write
      actions: read
    steps:
      # Never check out the candidate in a job holding write access or a key.
      # This immutable SHA is the source of the workflow that started the run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download tested firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          VERSION: ${{ needs.build.outputs.version }}
          ARTIFACT: ${{ needs.build.outputs.firmware_artifact }}
        run: gh run download "$RUN_ID" --repo "$REPO" --name "$ARTIFACT" --dir release
      - name: Validate assets and prepare signed manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_COMMIT"
          python3 tools/native_firmware.py prepare --directory release --version "$VERSION" --commit "$SOURCE_COMMIT"
      - name: Sign manifest with isolated native release key
        env:
          TECHO5_NATIVE_SIGN_KEY: ${{ secrets.TECHO5_NATIVE_SIGN_KEY }}
        run: python3 tools/native_firmware.py sign --directory release
      - name: Publish own experimental firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          # Fail a collision; do not overwrite any existing tag, asset or release.
          python3 - "$VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path
          info = json.loads(Path('release/build-info.json').read_text())
          notes = f"""Experimental TECHO5 Realtime Voice firmware {sys.argv[1]}, based on upstream {info['release_tag']}.

          Includes the full ARM root filesystem and keyless bootstrap images for Echo Show 5 first generation (checkers) and second generation (cronos). Bootstrap kernels/initramfs are the reviewed upstream v0.7.16 bytes, recorded in build-info.json and signed by this fork's independent release key.

          Optional paid cloud voice; not upstream supported. New full-image boot and OTA acceptance are pending. The earlier first-generation spoken pilot is not a complete hardware regression claim. The WebRTC AEC helper is included; physical echo/interrupt acceptance remains pending. The optional Spotify helper is not included. No device is flashed automatically.

          Native Realtime does not include the separate private Home Assistant tools extension. Default Home Assistant Assist remains available. See the README and docs/fork-maintenance.md for installation, costs and boundaries.

          Source: {info['commit']}; upstream source: {info['upstream_commit']}.
          """
          Path('release-notes.md').write_text(notes)
          PY
          # Atomic ref creation fails if ANY tag already exists. --target alone
          # would silently use an existing tag pointing at unrelated history.
          gh api "repos/$REPO/git/refs" --method POST -f ref="refs/tags/$VERSION" -f sha="$SOURCE_COMMIT" > /dev/null
          gh release create "$VERSION" --repo "$REPO" --target "$SOURCE_COMMIT" --draft --prerelease=false --title "EXPERIMENTAL Realtime Voice $VERSION" --notes-file release-notes.md
          gh release upload "$VERSION" release/* --repo "$REPO"
          # Draft publication is last: latest never points at incomplete assets.
          gh release edit "$VERSION" --repo "$REPO" --draft=false --latest
          echo "Published https://github.com/$REPO/releases/tag/$VERSION" >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: [build, promote, publish]
    if: always() && github.repository == 'Benniphx/techo5' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Update failure notification
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          title='Native daily build needs attention'
          pages=$(gh api "repos/$REPO/issues?state=open&per_page=100" --paginate --slurp)
          issue=$(jq -r '[.[][] | select(.title == "Native daily build needs attention" and .user.login == "github-actions[bot]" and (.pull_request == null)) | .number] | .[0] // empty' <<<"$pages")
          if [ "$BUILD_RESULT" = success ] && { [ "$PROMOTE_RESULT" = success ] || [ "$PROMOTE_RESULT" = skipped ]; } && { [ "$PUBLISH_RESULT" = success ] || [ "$PUBLISH_RESULT" = skipped ]; }; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$REPO" --comment "Daily stable build recovered: $RUN_URL"
            fi
          else
            printf '@Benniphx The daily native stable build stopped. Main was not force-updated and no device was installed.\n\nBuild: %s; promotion: %s; publication: %s. Inspect logs: %s\n' "$BUILD_RESULT" "$PROMOTE_RESULT" "$PUBLISH_RESULT" "$RUN_URL" > "$RUNNER_TEMP/failure.md"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$REPO" --body-file "$RUNNER_TEMP/failure.md"
            else
              gh issue create --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/failure.md"
            fi
          fi
