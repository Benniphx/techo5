# Echo Show 8 (2nd gen, athena, MT8183) on Amazon's stock 32-bit kernel. Sourced by etc/techo5/boot.sh.
#
# There is no initramfs: the kernel mounts the system partition read-only as / and runs the athena
# /init (tools/linux/athena/init) at its root. That partition is the slot store; /init pivots into a
# slot and the store appears at /store, as on the other Shows. Userdata is Fire OS's own, so TECHO5
# keeps everything in one directory there (userdata/techo5), which /init binds to /data.
T5_PRODUCT="Echo Show 8 2nd gen Linux"
STORE_DEV=/dev/mmcblk1p21
DATA_DEV=/dev/mmcblk1p23
# Drivers and firmware stay on the vendor partition, mounted read-only where they are; never copied.
VENDOR_DEV=/dev/mmcblk1p12
FIRMWARE_PATH=/vendor/firmware
# MT7663 over SDIO: the prealloc module first, then the driver, which makes wlan0.
WIFI_PRE_MODULES=/vendor/lib/modules/wlan_mt76x3_sdio_prealloc.ko
WIFI_MODULE=/vendor/lib/modules/wlan_mt76x3_sdio.ko
# Bluetooth (btmtksdio) is not brought up yet.
BT_MODULE=/vendor/lib/modules/none.ko
# Bring-up: RNDIS on the USB gadget next to the serial port, and SSH with the bench key that the
# store image carries at its root (never in a slot image).
USB_RNDIS=172.16.42.1
BENCH_SSH_KEYS=/store/root/.ssh
